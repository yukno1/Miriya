name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SLANG_VERSION: 2026.8

jobs:
  windows:
    name: Windows (shader / fmt / clippy / test / dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Slang compiler
        shell: pwsh
        run: |
          $url = "https://github.com/shader-slang/slang/releases/download/v${env:SLANG_VERSION}/slang-${env:SLANG_VERSION}-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile slang.zip
          Expand-Archive slang.zip -DestinationPath slang -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\slang\bin"

      - name: Compile shaders with Slang
        shell: pwsh
        run: |
          slangc shaders/hello/triangle.slang -profile glsl_450 -target spirv -fvk-use-entrypoint-name -o shaders/hello/triangle.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          slangc shaders/cube/cube.slang -profile glsl_450 -target spirv -fvk-use-entrypoint-name -o shaders/cube/cube.spv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- shaders/hello/*.spv shaders/cube/*.spv

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Build managed runtime
        run: dotnet build managed/Miriya.Runtime/Miriya.Runtime.csproj -c Release

      - name: Build managed scripting
        run: dotnet build managed/Miriya.Scripting/Miriya.Scripting.csproj -c Release

  linux:
    name: Linux (shader / interface check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Slang compiler
        shell: bash
        run: |
          url="https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          curl -L "$url" -o slang.tar.gz
          mkdir -p slang
          tar -xzf slang.tar.gz -C slang
          chmod +x slang/bin/slangc
          echo "$GITHUB_WORKSPACE/slang/bin" >> "$GITHUB_PATH"

      - name: Compile shaders with Slang
        shell: bash
        run: |
          slangc shaders/hello/triangle.slang -profile glsl_450 -target spirv -fvk-use-entrypoint-name -o shaders/hello/triangle.spv
          slangc shaders/cube/cube.slang -profile glsl_450 -target spirv -fvk-use-entrypoint-name -o shaders/cube/cube.spv
          git diff --exit-code -- shaders/hello/*.spv shaders/cube/*.spv

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install winit system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace for Linux interface compatibility
        run: cargo check --workspace
