name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (fmt / clippy / test / dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Build managed runtime
        run: dotnet build managed/Miriya.Runtime/Miriya.Runtime.csproj -c Release

      - name: Build managed scripting
        run: dotnet build managed/Miriya.Scripting/Miriya.Scripting.csproj -c Release

  linux:
    name: Linux (interface check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace for Linux interface compatibility
        run: cargo check --workspace
