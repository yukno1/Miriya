[workspace]
resolver = "2"
members = [
    "crates/*",
    "tools/*",
    "tests",
]
# 在根目录直接 `cargo run` / `cargo test` 时默认进入示例包
default-members = ["crates/miriya-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
miriya-engine = { path = "crates/miriya-engine" }
thiserror = "2"
vulkanalia = { version = "0.35", features = ["libloading", "window"] }
# wgpu 首选后端；spirv feature 复用 Slang 离线编译的 .spv（ADR-0014）。
wgpu = { version = "30", features = ["spirv"] }
pollster = "1"
raw-window-handle = "0.6"
# M3：ECS 内核、场景快照与基准。统一在 workspace 钉版本，子 crate 显式引用。
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
criterion = "0.5"
# M4：资产管线（稳定 ID、容器压缩、导入器、作业池与热重载、工具链）。
uuid = { version = "1", features = ["v7", "serde"] }
zstd = { version = "0.13", default-features = false, features = ["arrays"] }
notify = "9"
rayon = "1"
gltf = "1.4"
image = "0.25"
symphonia = "0.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

# 本机 MSVC 18 的 cl.exe 在 zstd-sys 使用 /Z7 时触发 D8050；
# 仅对该 C 依赖关闭 profile 调试信息，不影响引擎自身的 debug 构建。
[profile.dev.package.zstd-sys]
debug = 0

[profile.release.package.zstd-sys]
debug = 0
